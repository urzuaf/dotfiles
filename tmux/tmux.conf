# Habilitar colores reales (24-bit True Color) para que Neovim se vea idéntico
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Habilitar teclas extendidas para que Shift+Enter llegue intacto a las CLIs dentro de Tmux
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'kitty*:extkeys'

# Activar soporte para mouse / trackpad (puedes scrollear y cambiar paneles con clic)
set -g mouse on

# Empezar a contar ventanas y paneles desde 1 (en vez de 0, para coincidir con el teclado)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Atajos intuitivos para dividir ventanas (splits) conservando la carpeta actual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Tecla rápida para recargar la configuración de tmux con Prefix + r
bind r source-file ~/.tmux.conf \; display "¡Configuración de Tmux recargada!"

# Navegar entre paneles estilo Vim (Prefix + h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reducir el delay de la tecla Escape (vital para que Neovim responda al instante)
set -s escape-time 0
